<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zied Toumi — Chess Coach</title>
<meta name="description" content="Zied Toumi — chess coach in Tunisia. Private & group lessons, tactics, game analysis, and an interactive Play & Learn chess app.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EEE0;
    --paper:#EAE1CB;
    --maroon:#7A2E2A;
    --maroon-dk:#5E211E;
    --gold:#AD8A3F;
    --gold-lt:#C9A94F;
    --ink:#241D17;
    --ink-soft:#5A4F42;
    --line: rgba(36,29,23,.14);
    --serif: 'Fraunces', serif;
    --sans: 'Work Sans', sans-serif;
    --ar-head: 'Cairo', sans-serif;
    --ar-body: 'Tajawal', sans-serif;
    --max: 1040px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  body[dir="rtl"]{font-family:var(--ar-body);}
  body[dir="rtl"] h1,body[dir="rtl"] h2,body[dir="rtl"] h3,body[dir="rtl"] .brand,body[dir="rtl"] .stat b,body[dir="rtl"] .btn,body[dir="rtl"] .tag{font-family:var(--ar-head);}
  h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; color:var(--ink);}
  p{margin:0;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}
  section{padding:72px 0;}
  .rule{height:1px;background:var(--line);}

  /* ===== Lang switch ===== */
  .langbar{
    position:sticky;top:0;z-index:50;background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .langbar .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;}
  .brand{font-size:1.05rem;font-weight:700;letter-spacing:.01em;}
  .brand span{color:var(--maroon);}
  .langswitch{display:flex;gap:4px;background:var(--paper);border-radius:20px;padding:3px;}
  .langswitch button{
    font-family:var(--sans);border:none;background:transparent;color:var(--ink-soft);
    font-size:.78rem;font-weight:600;padding:7px 14px;border-radius:16px;cursor:pointer;letter-spacing:.02em;
  }
  .langswitch button.active{background:var(--maroon);color:var(--cream);}
  body[dir="rtl"] .langswitch button{font-family:var(--ar-body);}

  /* ===== Hero ===== */
  .hero{padding:64px 0 0;}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;}
  .tag{
    display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--maroon);
    border:1px solid var(--maroon); border-radius:20px;padding:6px 14px;margin-bottom:22px;
  }
  .hero h1{font-size:3.1rem;line-height:1.06;letter-spacing:-.01em;}
  .hero h1 em{font-style:italic;color:var(--maroon);}
  .hero .lede{margin-top:20px;font-size:1.08rem;color:var(--ink-soft);max-width:46ch;}
  .hero .cta-row{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;align-items:center;}
  .btn{
    font-family:var(--sans);font-weight:600;font-size:.92rem;padding:13px 24px;border-radius:3px;
    border:1.5px solid var(--maroon); background:var(--maroon); color:var(--cream); cursor:pointer;
    text-decoration:none;display:inline-block;
  }
  .btn.ghost{background:transparent;color:var(--maroon);}
  .contact-line{font-size:.88rem;color:var(--ink-soft);}
  .contact-line b{color:var(--ink);font-weight:600;}

  .board-art{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;
    box-shadow:0 18px 44px -14px rgba(36,29,23,.35); border:1px solid var(--line);}
  .board-art img{width:100%;height:100%;object-fit:cover;display:block;}

  .idbar{margin-top:44px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;gap:28px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft);}
  .idbar b{color:var(--ink);}

  /* ===== Stats ===== */
  .stats{background:var(--maroon);color:var(--cream);}
  .stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding-top:40px;padding-bottom:40px;}
  .stat{text-align:center;padding:0 12px;border-inline-start:1px solid rgba(244,238,224,.22);}
  .stat:first-child{border-inline-start:none;}
  .stat b{display:block;font-family:var(--serif);font-size:2.1rem;color:var(--gold-lt);font-weight:600;}
  .stat span{display:block;font-size:.74rem;letter-spacing:.05em;margin-top:6px;color:#E7DCC5;}

  /* ===== Section heads ===== */
  .sh{margin-bottom:36px;max-width:60ch;}
  .sh .kicker{font-size:.72rem;font-weight:700;letter-spacing:.09em;color:var(--maroon);text-transform:uppercase;margin-bottom:10px;display:block;}
  body[dir="rtl"] .sh .kicker{text-transform:none;}
  .sh h2{font-size:2rem;}
  .sh p{margin-top:14px;color:var(--ink-soft);}

  /* ===== About ===== */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
  .about-grid p{color:var(--ink-soft);margin-bottom:14px;}
  .about-grid p:last-child{margin-bottom:0;}
  .credential-box{background:var(--paper);border-radius:6px;padding:26px;}
  .credential-box dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:12px 0;font-size:.92rem;}
  .credential-box dt{color:var(--ink-soft);}
  .credential-box dd{margin:0;font-weight:600;text-align:end;}
  .credential-box .divider{grid-column:1/-1;height:1px;background:var(--line);}

  /* ===== Method ===== */
  .method-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:8px;}
  .method-item{padding:0 26px;border-inline-start:1px solid var(--line);}
  .method-item:first-child{padding-inline-start:0;border-inline-start:none;}
  .method-item .num{font-family:var(--serif);font-size:.85rem;color:var(--gold);font-weight:600;letter-spacing:.05em;margin-bottom:14px;display:block;}
  .method-item h3{font-size:1.18rem;margin-bottom:10px;}
  .method-item p{color:var(--ink-soft);font-size:.92rem;}

  /* ===== Experience ===== */
  .exp-item{padding:26px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2.2fr;gap:24px;}
  .exp-item:last-child{padding-bottom:0;}
  .exp-item .when{font-size:.82rem;color:var(--maroon);font-weight:600;letter-spacing:.02em;}
  .exp-item h3{font-size:1.15rem;margin-top:4px;}
  .exp-item .role{font-size:.85rem;color:var(--ink-soft);margin-top:2px;}
  .exp-item .desc{color:var(--ink-soft);font-size:.94rem;}
  .cities{margin-top:8px;font-size:.85rem;color:var(--ink-soft);}
  .cities b{color:var(--ink);}

  /* ===== App / Play&Learn ===== */
  .app-section{background:var(--maroon-dk);color:var(--cream);}
  .app-section .sh .kicker{color:var(--gold-lt);}
  .app-section .sh h2{color:var(--cream);}
  .app-section .sh p{color:#D9CBB3;}
  .app-frame-wrap{
    position:relative;
    border-radius:8px;overflow:hidden;border:1px solid rgba(244,238,224,.2);
    background:#fff; box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
  }
  .app-frame-wrap iframe{width:100%;height:760px;border:none;display:block;background:#fff;}
  .app-loading{
    height:760px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
    font-size:.9rem;
  }
  .app-open{
    text-align:center;margin-top:16px;
  }
  .app-open a{font-size:.82rem;color:#D9CBB3;text-decoration:underline;text-underline-offset:3px;}
  .app-perks{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px;}
  .perk{background:rgba(244,238,224,.06);border:1px solid rgba(244,238,224,.16);border-radius:6px;padding:20px;}
  .perk .ico{font-size:1.3rem;margin-bottom:10px;display:block;}
  .perk h3{color:var(--cream);font-size:1.02rem;margin-bottom:6px;}
  .perk p{color:#D9CBB3;font-size:.86rem;}

  /* ===== Offer + Languages ===== */
  .offer-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;}
  .offer-list{list-style:none;margin:0;padding:0;display:grid;gap:14px;}
  .offer-list li{display:flex;gap:12px;align-items:flex-start;font-size:.96rem;color:var(--ink-soft);}
  .offer-list li::before{content:"♟";color:var(--maroon);font-size:1rem;line-height:1.5;flex:none;}
  .langs dl{margin:0;display:grid;gap:12px;}
  .langs .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:.92rem;}
  .langs .row b{font-weight:600;}
  .langs .row span{color:var(--gold);font-weight:600;font-size:.82rem;}

  /* ===== Testimonial ===== */
  .testimonial{text-align:center;max-width:720px;margin:0 auto;}
  .testimonial blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.45;color:var(--maroon-dk);}
  body[dir="rtl"] .testimonial blockquote{font-style:normal;font-family:var(--ar-head);}
  .testimonial cite{display:block;margin-top:20px;font-style:normal;font-size:.85rem;color:var(--ink-soft);letter-spacing:.03em;}

  /* ===== Contact / footer ===== */
  .contact{background:var(--paper);}
  .contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
  .contact h2{font-size:2rem;max-width:14ch;}
  .contact .lede{margin-top:16px;color:var(--ink-soft);max-width:42ch;}
  .contact-card{background:var(--cream);border-radius:8px;padding:32px;border:1px solid var(--line);}
  .contact-card .line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:.94rem;}
  .contact-card .line:last-child{border-bottom:none;}
  .contact-card .line span:first-child{color:var(--ink-soft);}
  .contact-card .line span:last-child{font-weight:600;}
  footer{padding:28px 0;text-align:center;font-size:.78rem;color:var(--ink-soft);}

  @media (max-width: 860px){
    .hero-grid,.about-grid,.offer-grid,.contact-grid{grid-template-columns:1fr;gap:32px;}
    .hero{padding-top:40px;}
    .hero h1{font-size:2.2rem;}
    .stats .wrap{grid-template-columns:repeat(2,1fr);row-gap:24px;}
    .stat{border-inline-start:none !important;}
    .method-list{grid-template-columns:1fr;gap:26px;}
    .method-item{border-inline-start:none;padding-inline-start:0;padding-top:20px;border-top:1px solid var(--line);}
    .method-item:first-child{border-top:none;padding-top:0;}
    .exp-item{grid-template-columns:1fr;gap:8px;}
    .app-perks{grid-template-columns:1fr;}
    .app-frame-wrap iframe,.app-loading{height:600px;}
    section{padding:52px 0;}
  }
</style>
</head>

    <div class="brand">ZIED <span>TOUMI</span></div>

      <button data-lang="fr">Français</button>

</div>

function applyLang(lang){
  const dict = I18N[lang];
  document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.innerHTML = dict[key];
  });
  const offerList = document.getElementById('offerList');
  offerList.innerHTML = '';
  dict['offer.items'].forEach(item=>{
    const li = document.createElement('li');
    li.textContent = item;
    offerList.appendChild(li);
  });
  document.querySelectorAll('.langswitch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  loadApp(lang);
}

function loadApp(lang){
  const frame = document.getElementById('appFrame');
  const loading = document.getElementById('appLoading');
  frame.style.display = 'none';
  loading.style.display = 'flex';
  loading.textContent = I18N[lang]['app.loading'];
  frame.onload = ()=>{ loading.style.display='none'; frame.style.display='block'; };
  frame.src = APPS[lang];
}

document.querySelectorAll('.langswitch button').forEach(b=>{
  b.addEventListener('click', ()=> applyLang(b.dataset.lang));
});

applyLang('en');
</script>
